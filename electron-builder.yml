appId: com.vibetype.app
productName: Saykin
copyright: Copyright © 2026 Saykin contributors

directories:
  output: release
  buildResources: build

# The renderer is a static export; the main process is pre-bundled by esbuild.
# Nothing here needs node_modules at runtime except the two native addons.
files:
  - dist-electron/**/*
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'

# Native addons cannot be loaded from inside an asar archive — Node's loader
# needs a real filesystem path for the .node binary. Unpacking them keeps the
# rest of the app packed while leaving these loadable.
asar: true
asarUnpack:
  - node_modules/chrome-devtools-mcp/**/*
  - node_modules/koffi/**/*
  - node_modules/@koromix/**/*
  - node_modules/sherpa-onnx-node/**/*
  - node_modules/sherpa-onnx-win-x64/**/*

extraMetadata:
  main: dist-electron/main.js

win:
  target:
    - target: nsis
      arch: [x64]
  # Generated by scripts/generate-icon.mjs. Without this the build silently falls
  # back to the stock Electron logo, which is what shipped before.
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Saykin
  # Keeps the Add/Remove Programs entry and the uninstaller from showing the
  # generic Electron icon.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # Dictation tools are expected to keep running in the background, so do not
  # force-quit on close; the tray icon is the control surface.
  deleteAppDataOnUninstall: false

# Models are downloaded on demand into userData rather than bundled: shipping
# ~900 MB in the installer for a feature the user may replace with a cloud
# provider is the wrong default.
